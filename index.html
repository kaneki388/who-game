.chip.done{border-color:var(--ok)}
.bar{position:relative;background:var(--bg);border-radius:10px;margin-top:8px;overflow:hidden;border:1px solid var(--bd)}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--ac),var(--ac2));opacity:.35}
.bar span{position:relative;display:flex;justify-content:space-between;padding:10px 12px}
.win{font-size:20px;text-align:center;margin:10px 0 0;font-weight:700}
.note{color:var(--mut);font-size:13px;text-align:center;margin-top:8px}

.code{font-size:26px;letter-spacing:4px;text-align:center;font-weight:700}

#tm{text-align:center;font-weight:700;font-size:18px;color:var(--ac);min-height:24px}.pop{animation:pop .4s}@keyframes pop{from{transform:scale(.85);opacity:0}}
.x{background:none;border:0;width:auto;margin:0 4px 0 0;padding:0;font-size:12px;color:var(--mut)}.chip.sel{background:var(--ac);color:#fff;outline:0}
h1{color:var(--ac)}
</style>
</head>

    h+='<div class="card"><div style="text-align:center"><span class="tag">'+(q?TAG[q.k]:GAMES[c.g][0])+(c.mix?' 🎉':'')+(c.r&&cfg&&cfg.rounds?' · '+c.r+'/'+cfg.rounds:'')+'</span></div>';

      if(q.k==="conf"||q.k==="td"){const w=ps.length?ps[c.n%ps.length]:null;if(w)h+='<div class="win">🎯 الدور على: '+esc(w.name)+(w.me?' (أنت)':'')+'</div>'}
      else if(!isRev){const opts=q.k==="who"?ps.filter(p=>!p.me).map(p=>p.name):q.o;
        if(q.k==="who"&&!opts.length)h+='<div class="note">محتاجين لاعب تاني! ابعت الكود لصحابك 📲</div>';
        opts.forEach((o,i)=>{h+='<button class="'+(mine===o?'sel':'')+'" data-o="'+i+'">'+(q.k==="wyr"?(i?'ب) ':'أ) '):'')+esc(o)+'</button>'})}}
    else if(c.g==="tap"){h+='<div class="q" style="font-size:16px">استنى لما الزرار يبقى أخضر واضغط بسرعة! ضغطة بدري = خسارة</div>';
      if(!isRev){if(mine!==undefined)h+='<div class="win">تم ✅ '+(mine>0?mine+' م.ث':'ضغطت بدري ❌')+'</div>';
        else h+='<button class="big '+(tap.state==="go"?'green':'red')+'" onpointerdown="tapClick()">'+(tap.state==="go"?'🟩 اضغط دلوقتي!':'🟥 استنى…')+'</button>'}}
    else if(c.g==="num"){h+='<div class="q" style="font-size:16px">اختار رقم من 1 لـ 10. الأقل اللي محدش اختاره زيه بيكسب!</div>';
      if(!isRev){h+='<div class="grid">';for(let i=1;i<=10;i++)h+='<button class="'+(mine===i?'sel':'')+'" onclick="vote('+i+')">'+i+'</button>';h+='</div>'}}
    else if(c.g==="word"){const L=LET[Math.floor(c.n/7)%LET.length];h+='<div class="q">اكتب كل حاجة بحرف «'+esc(L)+'»</div>';
      if(!isRev){h+=mine!==undefined?'<div class="win">إجاباتك اتبعتت ✅</div>':ACATS.map((a,i)=>'<input id="wi'+i+'" maxlength="25" placeholder="'+AEM[i]+' '+a+' بحرف '+esc(L)+'">').join('')+'<button class="pri" onclick="submitWord()">🚌 خلصت!</button>'}}
    if(nv){const t=res(c);if(!isRev){h+='<div id="tm"></div><div class="note">جاوب '+t.done+' من '+ps.length+' — النتيجة بتظهر لما الكل يجاوب</div>';if(t.done>0)h+='<button onclick="forceRev()" style="font-size:13px;padding:8px">اكشف الآن</button>'}
      else{h+=t.rows.join("");if(t.head)h+='<div class="win">'+t.head+'</div>';if(c.g==="word"){h+=isHost()?'<div class="note">👑 إنت المشرف: اضغط على أي إجابة لقبولها أو رفضها. ⚠️ = مش في القاموس ومش محسوبة لحد ما تقبلها</div>'+(t.pend.length?'<button onclick="acceptAll()">✔ اقبل كل المشكوك فيها</button>':''):'<div class="note">⚠️ = مشكوك فيها، المشرف 👑 هو اللي بيحكم</div>'}}}
    h+='</div>';
    const canReady=!nv||isRev,nr=ps.filter(p=>RD[p.id]&&RD[p.id].n===c.n).length,wt=ps.filter(p=>!(RD[p.id]&&RD[p.id].n===c.n)).map(p=>p.name);
    if(canReady)h+=myR?'<button disabled>👍 إنت جاهز ('+nr+'/'+ps.length+')</button><div class="card" style="text-align:center;margin-top:10px;font-weight:700">⏳ مستنيين: '+wt.map(esc).join(" و ")+'</div>':'<button class="pri" onclick="ready()">✅ جاهز للجولة الجاية</button><div class="note">الجولة الجاية بتبدأ لما الكل يضغط جاهز</div>';
    h+='<div style="display:flex;gap:8px"><button onclick="nextRound()" style="font-size:13px;padding:8px">⏭ تخطي الجولة</button><button onclick="lobby()" style="font-size:13px;padding:8px">🏠 الألعاب</button>'+(c.g==="quiz"&&DECK[c.id].k!=="conf"&&DECK[c.id].k!=="td"?'<button onclick="badQ()" style="font-size:13px;padding:8px">🚩 سخيف</button>':'')+'<button onclick="rules(cur.g)" style="font-size:13px;padding:8px">📖 القواعد</button></div>'+(showRules===c.g?rulesHtml(c.g):'');
    lead(c,ps);
  }
  app.innerHTML=h;app.querySelectorAll("[data-jk]").forEach(e=>e.onclick=()=>jud(e.dataset.jk));if(c.g!=="lobby"&&lastFx!==c.n&&(c.g==="end"||(rev&&rev.n===c.n))){lastFx=c.n;fx()}
  app.querySelectorAll("button[data-o]").forEach(b=>b.onclick=()=>{const q2=DECK[cur.id],o=q2.k==="who"?active().filter(p=>!p.me).map(p=>p.name):q2.o;vote(o[+b.dataset.o])});
}
function addChat(o,ns){const b=document.querySelector("#chat .box");if(!b||!o||!o.text)return;if(!ns)saveChat(o);const d=document.createElement("div");d.className="m";const n=document.createElement("b");n.textContent=String(o.name||"؟")+": ";const t=document.createElement("span");t.textContent=String(o.text).slice(0,200);d.appendChild(n);d.appendChild(t);const down=b.scrollTop+b.clientHeight>=b.scrollHeight-30;b.appendChild(d);while(b.children.length>60)b.removeChild(b.firstChild);if(down)b.scrollTop=b.scrollHeight}
function sendChat(){const i=document.getElementById("ci"),v=i.value.trim();if(!v||!cl||!cl.connected)return;cl.publish(BT+"/c",JSON.stringify({id:id,name:name,text:v.slice(0,200),t:Date.now()}),{retain:false});i.value=""}
function buildChat(){document.getElementById("chat").innerHTML='<div class="card"><span class="tag">💬 الشات</span><div class="box" style="margin-top:8px"></div><div class="row"><input id="ci" maxlength="200" placeholder="اكتب رسالة…"><button class="pri" onclick="sendChat()">إرسال</button></div><div class="note">الشات بيتحفظ على جهازك</div></div>';document.getElementById("ci").addEventListener("keydown",e=>{if(e.key==="Enter")sendChat()});try{JSON.parse(ls("wa_ch_"+room)||"[]").forEach(o=>addChat(o,1))}catch(e){}}
function go(){const n=document.getElementById("nm").value.trim(),r=document.getElementById("rm").value.trim().replace(/[^A-Za-z0-9\u0600-\u06FF_-]/g,"");if(!n||!r)return;name=n;room=r;ls("wa_name",n);ls("wa_room",r);ss("wa_auto",JSON.stringify({n:n,r:r}));buildChat();join()}
if(ss("wa_auto")){try{const a=JSON.parse(ss("wa_auto"));name=a.n;room=a.r;buildChat();join()}catch(e){render()}}else render();
</script>
</body>
