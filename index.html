<title>مين فينا؟ أونلاين 🎭</title>
<style>
:root{--h:262;--h2:322;--bg:hsl(var(--h) 100% 97%);--card:#fff;--tx:#1d1730;--mut:#6b6485;--bd:hsl(var(--h) 55% 90%);--ac:hsl(var(--h) 78% 56%);--ac2:hsl(var(--h2) 85% 60%);--ok:#16a34a;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="ocean"]{--h:200;--h2:245}:root[data-theme="forest"]{--h:145;--h2:175}:root[data-theme="sunset"]{--h:22;--h2:355}:root[data-theme="rose"]{--h:338;--h2:20}
@media(prefers-color-scheme:dark){:root{--bg:hsl(var(--h) 30% 8%);--card:hsl(var(--h) 24% 13%);--tx:#f3f0ff;--mut:#a8a1c4;--bd:hsl(var(--h) 20% 25%)}}
html{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;min-height:100vh;line-height:1.5}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
.topbar h1{margin:0;font-size:20px;color:var(--ac)}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px hsl(var(--h) 40% 50% / .08)}
.q{font-size:21px;font-weight:700;line-height:1.6;text-align:center;margin:6px 0 14px}
.tag{display:inline-block;font-size:12px;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:3px 12px;border-radius:99px}
button,input{font:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px;width:100%;margin-top:8px;font-size:16px;transition:transform .1s,border-color .15s}
button:active{transform:scale(.97)}button:hover{border-color:var(--ac)}
button:disabled{opacity:.6;cursor:default}
button.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;font-weight:700}
button.sel{border-color:var(--ac);box-shadow:0 0 0 3px hsl(var(--h) 80% 60% / .35)}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin-top:8px}
input:focus{outline:2px solid var(--ac);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:2px solid var(--bd);border-radius:99px;padding:3px 12px 3px 6px;font-size:14px}
