<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مين فينا؟ أونلاين 🎭</title>
<style>
:root{--h:262;--h2:322;--bg:hsl(var(--h) 100% 97%);--card:#fff;--tx:#1d1730;--mut:#6b6485;--bd:hsl(var(--h) 55% 90%);--ac:hsl(var(--h) 78% 56%);--ac2:hsl(var(--h2) 85% 60%);--ok:#16a34a;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="ocean"]{--h:200;--h2:245}:root[data-theme="forest"]{--h:145;--h2:175}:root[data-theme="sunset"]{--h:22;--h2:355}:root[data-theme="rose"]{--h:338;--h2:20}
@media(prefers-color-scheme:dark){:root{--bg:hsl(var(--h) 30% 8%);--card:hsl(var(--h) 24% 13%);--tx:#f3f0ff;--mut:#a8a1c4;--bd:hsl(var(--h) 20% 25%)}}
html{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;min-height:100vh;line-height:1.5}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
.topbar h1{margin:0;font-size:20px;color:var(--ac)}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px hsl(var(--h) 40% 50% / .08)}
.q{font-size:21px;font-weight:700;line-height:1.6;text-align:center;margin:6px 0 14px}
.tag{display:inline-block;font-size:12px;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:3px 12px;border-radius:99px}
button,input{font:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px;width:100%;margin-top:8px;font-size:16px;transition:transform .1s,border-color .15s}
button:active{transform:scale(.97)}button:hover{border-color:var(--ac)}
button:disabled{opacity:.6;cursor:default}
button.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;font-weight:700}
button.sel{border-color:var(--ac);box-shadow:0 0 0 3px hsl(var(--h) 80% 60% / .35)}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;margin-top:8px}
input:focus{outline:2px solid var(--ac);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:2px solid var(--bd);border-radius:99px;padding:3px 12px 3px 6px;font-size:14px}
.chip.done{border-color:var(--ok)}.chip.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
.av{width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle}.av.sm{width:20px;height:20px;margin-inline-end:4px}.av.big{width:72px;height:72px}
.avbtn{width:84px;height:84px;border-radius:50%;padding:0;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;border:2px dashed var(--ac)}
.bar{position:relative;background:var(--bg);border-radius:12px;margin-top:8px;overflow:hidden;border:1px solid var(--bd)}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--ac),var(--ac2));opacity:.35}
.bar span{position:relative;display:flex;justify-content:space-between;padding:10px 12px}
.win{font-size:20px;text-align:center;margin:10px 0 0;font-weight:700}
.note{color:var(--mut);font-size:13px;text-align:center;margin-top:8px}
.m{padding:3px 0;word-break:break-word}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.grid button{margin:0;padding:14px 0}
.big{height:150px;font-size:24px;font-weight:700;color:#fff;border:0}.red{background:#dc2626}.green{background:#16a34a}
.gm{text-align:right;border-inline-start:5px solid var(--ac);font-weight:700}.gm small{display:block;color:var(--mut);font-size:13px;font-weight:400}
.code{font-size:28px;letter-spacing:5px;text-align:center;font-weight:800;color:var(--ac)}
.cf{position:fixed;top:-30px;font-size:24px;animation:fall 2.6s linear forwards;pointer-events:none;z-index:9}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#tm{text-align:center;font-weight:700;font-size:18px;color:var(--ac);min-height:24px}.pop{animation:pop .4s}@keyframes pop{from{transform:scale(.85);opacity:0}}
.x{background:none;border:0;width:auto;margin:0 4px 0 0;padding:0;font-size:12px;color:var(--mut)}
.ib{width:auto;margin:0;padding:6px 12px;font-size:15px;border-radius:12px}
#chat .chead{display:flex;align-items:center;justify-content:space-between}
#chat .box{height:190px;overflow-y:auto;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:8px;font-size:14px;margin-top:8px}
#chat .m b{color:var(--ac)}#chat .row{display:flex;gap:6px;margin-top:8px;align-items:center}#chat .row input{margin:0}#chat .row .pri{width:auto;margin:0;padding:10px 16px}
.emo{display:none;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:6px}.emo button{margin:0;padding:6px 0;font-size:20px;background:none;border:0}
.vm{display:inline-block;width:auto;margin:0 4px;padding:3px 12px;font-size:13px;border-radius:99px}
.rec{background:#dc2626!important;color:#fff;border-color:#dc2626}

/* ===== look: sticker / game-show ===== */
:root{--ink:#1d1730;--bg:hsl(var(--h) 90% 93%);--card:#fff;--bd:var(--ink);--tx:var(--ink);--mut:#5b5475;--ac:hsl(var(--h) 88% 60%);--ac2:hsl(var(--h2) 90% 62%);--yel:#ffd93b;--ink-on:#1d1730}
@media(prefers-color-scheme:dark){:root{--ink:#f3f0ff;--bg:hsl(var(--h) 38% 9%);--card:hsl(var(--h) 28% 15%);--tx:#f3f0ff;--mut:#b9b2d4;--bd:var(--ink)}}
body{font-family:"Cairo","Noto Color Emoji","Tajawal",Tahoma,sans-serif;font-weight:600;background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--ink) 16%,transparent) 1.2px,transparent 1.7px);background-size:22px 22px}
.topbar{background:var(--ac);border-bottom:3px solid var(--ink);padding:8px 16px}
.topbar h1{font-family:"Lalezar","Cairo","Noto Color Emoji",sans-serif;font-weight:400;font-size:28px;color:#fff;text-shadow:2px 2px 0 #1d1730;letter-spacing:0}
.card{border:2.5px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink)}
.q{font-family:"Lalezar","Cairo","Noto Color Emoji",sans-serif;font-weight:400;font-size:29px;line-height:1.55}
.win{font-family:"Lalezar","Cairo","Noto Color Emoji",sans-serif;font-weight:400;font-size:25px}
.tag{background:var(--yel);color:var(--ink-on);border:2px solid var(--ink-on);border-radius:8px;padding:2px 12px;font-size:14px;font-weight:800}
button{font-weight:700;border:2.5px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:hover{border-color:var(--ink);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
button:disabled{box-shadow:none;transform:none}
button.pri{background:var(--ac);color:var(--ink-on);border:2.5px solid var(--ink)}
button.sel{background:var(--yel);color:var(--ink-on);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.x,.ib{box-shadow:none}.ib{border-width:2px}.x{border:0}
input{border:2.5px solid var(--ink);border-radius:12px;background:var(--card);font-weight:600}
input:focus{outline:3px solid var(--ac);outline-offset:2px}
.chip{border:2px solid var(--ink);background:var(--card);font-weight:700}
.chip.sel{background:var(--yel);color:var(--ink-on)}
.av{border:2px solid var(--ink)}
.bar{border:2px solid var(--ink);border-radius:10px;background:var(--card)}.bar i{background:var(--ac);opacity:.6}
.big{font-family:"Lalezar","Cairo","Noto Color Emoji",sans-serif;font-weight:400;font-size:32px;border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink)}
.red{background:#e5352b}.green{background:#16a34a}
.grid button{font-family:"Lalezar","Cairo","Noto Color Emoji",sans-serif;font-weight:400;font-size:22px}
.gm{border-inline-start:9px solid var(--ac);font-family:"Lalezar","Cairo","Noto Color Emoji",sans-serif;font-weight:400;font-size:21px}
.gm small{font-family:"Cairo",Tahoma,sans-serif;font-size:13px;font-weight:600}
.code{font-family:"Lalezar","Cairo","Noto Color Emoji",sans-serif;font-weight:400;font-size:40px;letter-spacing:6px;background:var(--yel);color:var(--ink-on);border:2.5px dashed var(--ink-on);border-radius:12px;padding:2px 0}
#chat .box{border:2.5px solid var(--ink);background:var(--card)}
@media(prefers-reduced-motion:reduce){.cf{display:none}.pop{animation:none}button{transition:none}}

#app section[data-t],#chat{display:none}
body[data-tab="play"] #app section[data-t="play"],body[data-tab="score"] #app section[data-t="score"],body[data-tab="room"] #app section[data-t="room"],body[data-tab="chat"] #chat{display:block}
main{padding-bottom:96px}
#nav{position:fixed;inset:auto 0 0 0;z-index:8;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:3px solid var(--ink)}
#nav button{flex:1;margin:0;padding:6px 0;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.3;position:relative;box-shadow:none;border-width:2px}
#nav button span{font-size:20px}#nav button.on{background:var(--yel);color:var(--ink-on);box-shadow:2px 2px 0 var(--ink)}
#nav i{display:none;position:absolute;top:-8px;inset-inline-end:6px;min-width:20px;padding:0 5px;border-radius:99px;background:#e5352b;color:#fff;font:800 12px/20px Cairo,sans-serif;font-style:normal;text-align:center;border:2px solid var(--ink)}

/* ===== login + lobby + games ===== */
.hero{text-align:center;margin:2px 0 10px}.hero .em{font-size:30px;letter-spacing:8px}
.hero .hl{font-family:"Lalezar","Cairo","Noto Color Emoji",sans-serif;font-size:50px;line-height:1.25;color:var(--ac);text-shadow:3px 3px 0 var(--ink)}
.hero .hs{color:var(--mut);font-weight:700;font-size:15px}
.rowc{display:flex;gap:8px;align-items:center}.rowc input{margin-top:8px}.rowc .ib{margin-top:8px;padding:10px 14px;font-size:22px;flex:none;width:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.tiles .gm{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-inline-start-width:2.5px;border-inline-start-color:var(--ink);min-height:108px;padding:12px 6px;font-size:19px;line-height:1.3;color:#1d1730}
.tiles .gm small{color:#1d1730;opacity:1;margin-top:4px;font-size:12px;line-height:1.4}
.tiles .gm:first-child{grid-column:1/-1;min-height:0;background:var(--ac)}
.tiles .gm:nth-child(2){background:#ffe08a}.tiles .gm:nth-child(3){background:#b8f0c8}.tiles .gm:nth-child(4){background:#ffc2d4}.tiles .gm:nth-child(5){background:#bfe3ff}
.tiles .gm:nth-child(6){background:#e0cfff}.tiles .gm:nth-child(7){background:#ffd0a8}.tiles .gm:nth-child(8){background:#c9f2f0}.tiles .gm:nth-child(9){background:#fbc8f0}
button[data-o]{text-align:right;font-size:18px;padding:14px;border-inline-start-width:10px}
button[data-o="0"]{border-inline-start-color:var(--ac)}button[data-o="1"]{border-inline-start-color:#ffd93b}button[data-o="2"]{border-inline-start-color:#3bbf7a}button[data-o="3"]{border-inline-start-color:#ff6b8b}
#app .m{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;margin-top:6px}
#app .win{background:var(--yel);color:var(--ink-on);border:2.5px solid var(--ink);border-radius:12px;padding:6px 10px;box-shadow:3px 3px 0 var(--ink)}
#tm{display:table;margin:8px auto 0;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:0 14px}
.role{border:3px solid var(--ink);border-radius:16px;padding:20px 8px;background:#c9f2f0;color:#1d1730;box-shadow:4px 4px 0 var(--ink);transform:rotate(-1deg)}
.role.spy{background:#1d1730;color:#ffd93b;border-color:#ffd93b}
.big{height:200px;width:100%;touch-action:manipulation;font-size:36px}

.rl{background:var(--gc,#ffe08a);color:#1d1730;border:2.5px solid var(--ink);border-radius:14px;text-align:right;line-height:1.9;font-size:15px;padding:12px 14px;margin-top:10px}
.card.rl{box-shadow:5px 5px 0 var(--ink)}
.gcard .gh{font-family:"Lalezar","Cairo","Noto Color Emoji",sans-serif;font-size:28px;text-align:center;background:var(--gc);color:#1d1730;border:2.5px solid var(--ink);border-radius:14px;padding:6px;margin-top:10px}
.gcard .back{margin:0}
</style>

<script>
window.onerror=function(m,u,l){var a=document.getElementById("app");if(a)a.innerHTML='<div class="card"><div class="q">حصل خطأ 😕</div><div class="note" style="direction:ltr">'+String(m)+' (line '+l+')</div></div>'};
document.getElementById&&(window.__js=1);
</script>
<div class="topbar"><h1>🎭 مين فينا؟</h1><button class="ib" onclick="cycleTheme()" title="غيّر الألوان">🎨 الألوان</button></div>
<main>
<div class="sub" id="sub" hidden></div>
<div id="app"><div class="card"><div class="note" style="font-size:15px;line-height:1.9">⏳ بيحمّل اللعبة…<br>لو الرسالة دي فضلت ظاهرة، يبقى المتصفح اللي فاتح الملف (واتساب أو معاينة الملفات) مش بيشغّل الجافاسكربت. انسخ الملف لتليفونك وافتحه من Chrome مباشرة.</div></div></div>
<div id="chat" data-t="chat"></div>
<input type="file" id="pf" accept="image/*" hidden>
</main>
<script>
const DECK=(function(){const B=["بيقول «جاي في الطريق» وهو لسه في السرير","بيبعت رسالة للشخص الغلط","بيشوف الرسالة وبيسيبها أيام من غير رد","بيعمل ستوكينج لإكسه على السوشيال","بيعيط على أفلام الكرتون لحد دلوقتي","بيغني في الحمام بصوت عالي","بيكلم نفسه قدام المراية","بيقول حوارات الأفلام في الوقت الغلط","بيضحك لوحده في الشارع على حاجة فكر فيها","بيتكسف يطلب فلوسه اللي سلفها","بيكدب عشان يهرب من خروجة","بيسمع أغنية محرجة في السر","بيعمل لايك بالغلط على صورة قديمة جداً","بيقعد ساعة يختار ستيكر","بيرقص لوحده في البيت","بيتصور 20 سيلفي عشان صورة واحدة","بيتكلم عن نفسه في أي قعدة","بيقول «أنا مش زعلان» وهو زعلان جداً","بيتخانق مع الموبايل","بيدخل المطبخ ياكل في السر الساعة 3 الفجر","بيكلم الدليفري كأنه صاحبه","بيبعت رسالة صوتية مدتها 5 دقايق","بيمثل إنه فاهم في موضوع وهو مش فاهم حاجة","بيتأخر على معاد مهم ومش بيعتذر","بيتخيل نفسه بطل فيلم وهو ماشي في الشارع","بيدخل بروفايل حد بيحبه كل يوم","بيقول «هنتقابل قريب» وده مش هيحصل","بيخاف من الصراصير أكتر من الكل","بيشتري حاجات مالهاش لازمة عشان عليها خصم","بيقول هعمل دايت من بكرة كل يوم","بيضيع في شارع بيعرفه من 10 سنين","بيتفرج على فيديوهات القطط ساعات","بيحط منبه 10 مرات ومش بيقوم","بيكتب بوست وبيمسحه بعد دقيقة","بيتكسف يرد على رقم غريب","بيسمع نفس الأغنية 50 مرة","بيحلف بالله على حاجة بسيطة","بيوعد الكل بحاجة وبينساها","بيقول نكتة ومحدش بيضحك","بيرد على رسالة بعد ما الموضوع كله يعدي","بيشارك ميمز الساعة 4 الفجر","بيعمل ستيكر لكل حاجة في الجروب","بيلبس نفس الهدوم 3 أيام","بيسيب المواعين للصبح كل يوم","بيمثل إنه مسافر وهو في البيت","بيقعد ساعات في الحمام على الموبايل","بيحكي نفس الحكاية كل مرة وبيضيف عليها","بيتجنب أي مواجهة","بيحب يكون أول واحد يعرف أي فضيحة","بيطلب أكل فوراً بعد أي إعلان","بيضيع الشاحن دايماً","بيطلب نفس الأكلة في المطعم من 5 سنين","بيكتب رأي في الجروب وبيمسحه بسرعة","بيخاف من الضلمة وبيخبي ده","بيخلص رصيد الموبايل في يومين","بيعمل نفسه نايم عشان يهرب من الكلام","بيزعل لو حد مردش في دقيقة","بيسلم على حد في الشارع وهو مش هو"];

        if(ps.length){const as=ps[((TN[c.n]&&TN[c.n].i)||0)%ps.length];h+='<div class="win">🎤 دور '+esc(as.name)+(as.me?' (أنت)':'')+' يسأل أي لاعب سؤال عن المكان</div><button onclick="nextTurn()" style="font-size:13px;padding:8px">⏭ خلّصنا، الدور اللي بعده</button>'}h+='<div class="note" style="margin-top:10px">لما تبقى جاهز صوّت على مين الجاسوس:</div>';ps.filter(p=>!p.me).forEach((p,i)=>{h+='<button class="'+(mine===p.name?'sel':'')+'" data-o="'+i+'">'+esc(p.name)+'</button>'})}}
    if(nv){const t=res(c);if(!isRev){h+='<div id="tm"></div><div class="note">جاوب '+t.done+' من '+ps.length+' — النتيجة بتظهر لما الكل يجاوب</div>';if(t.done>0)h+='<button onclick="forceRev()" style="font-size:13px;padding:8px">اكشف الآن</button>'}
      else{h+=t.rows.join("");if(t.head)h+='<div class="win">'+t.head+'</div>';if(c.g==="word"){h+=isHost()?'<div class="note">👑 إنت المشرف: اضغط على أي إجابة لقبولها أو رفضها. ⚠️ = مش في القاموس ومش محسوبة لحد ما تقبلها</div>'+(t.pend.length?'<button onclick="acceptAll()">✔ اقبل كل المشكوك فيها</button>':''):'<div class="note">⚠️ = مشكوك فيها، المشرف 👑 هو اللي بيحكم</div>'}}}
    h+='</div>';
    const canReady=!nv||isRev,nr=ps.filter(p=>RD[p.id]&&RD[p.id].n===c.n).length,wt=ps.filter(p=>!(RD[p.id]&&RD[p.id].n===c.n)).map(p=>p.name);
    if(canReady)h+=myR?'<button disabled>👍 إنت جاهز ('+nr+'/'+ps.length+')</button><div class="card" style="text-align:center;margin-top:10px;font-weight:700">⏳ مستنيين: '+wt.map(esc).join(" و ")+'</div>':'<button class="pri" onclick="ready()">✅ جاهز للجولة الجاية</button><div class="note">الجولة الجاية بتبدأ لما الكل يضغط جاهز</div>';
    h+='<div style="display:flex;gap:8px"><button onclick="nextRound()" style="font-size:13px;padding:8px">⏭ تخطي الجولة</button><button onclick="lobby()" style="font-size:13px;padding:8px">🏠 الألعاب</button>'+(c.g==="quiz"&&DECK[c.id].k!=="conf"&&DECK[c.id].k!=="td"?'<button onclick="badQ()" style="font-size:13px;padding:8px">🚩 سخيف</button>':'')+'<button onclick="rules(cur.g)" style="font-size:13px;padding:8px">📖 القواعد</button></div>'+(showRules===c.g?rulesHtml(c.g):'');
    lead(c,ps);
  }
  h+="</section>";app.innerHTML=h;app.querySelectorAll("[data-jk]").forEach(e=>e.onclick=()=>jud(e.dataset.jk));app.querySelectorAll("[data-je]").forEach(e=>e.onclick=()=>judE(e.dataset.je));if(c.g!=="lobby"&&lastFx!==c.n&&(c.g==="end"||(rev&&rev.n===c.n))){lastFx=c.n;fx()}
  app.querySelectorAll("button[data-o]").forEach(b=>b.onclick=()=>{let o;if(cur.g==="spy")o=active().filter(p=>!p.me).map(p=>p.name);else{const q2=DECK[cur.id];o=q2.k==="who"?active().filter(p=>!p.me).map(p=>p.name):q2.o}vote(o[+b.dataset.o])});
}
function chatAv(i){const a=(P[i]&&P[i].av)||(i===id&&PIC);if(typeof a==="string"&&PICRE.test(a)){const im=document.createElement("img");im.className="av sm";im.src=a;return im}const sp=document.createElement("span");sp.textContent=i?AVT(i)+" ":"";return sp}
function chatPush(d){if(TAB!=="chat"&&cl&&cl.connected){UN++;updNav()}const b=document.querySelector("#chat .box");if(!b)return;const down=b.scrollTop+b.clientHeight>=b.scrollHeight-30;b.appendChild(d);while(b.children.length>60)b.removeChild(b.firstChild);if(down)b.scrollTop=b.scrollHeight}
function addChat(o,ns){if(!document.querySelector("#chat .box")||!o||!o.text)return;if(!ns)saveChat(o);const d=document.createElement("div");d.className="m";d.appendChild(chatAv(o.id));const n=document.createElement("b");n.textContent=String(nm(o))+": ";const t=document.createElement("span");t.textContent=String(o.text).slice(0,200);d.appendChild(n);d.appendChild(t);chatPush(d)}
function addVoice(o){if(!document.querySelector("#chat .box")||!o||typeof o.data!=="string"||o.data.length>300000||!/^data:audio\/[\w.+-]+(;[\w=.,-]+)*;base64,/i.test(o.data.slice(0,100)))return;const d=document.createElement("div");d.className="m";d.appendChild(chatAv(o.id));const n=document.createElement("b");n.textContent=String(nm(o))+": ";d.appendChild(n);const bt=document.createElement("button");bt.className="vm";bt.textContent="▶️ رسالة صوتية";bt.onclick=()=>playV(o.data,bt,0);d.appendChild(bt);chatPush(d);if(AUTOV&&o.id!==id)playV(o.data,bt,1)}
function sendChat(){const i=document.getElementById("ci"),v=i.value.trim();if(!v||!cl||!cl.connected)return;P2("c",{id:id,name:name,text:v.slice(0,200),t:Date.now()},0);i.value=""}
function buildChat(){mkNav();document.getElementById("chat").innerHTML='<div class="card"><div class="chead"><span class="tag">💬 الشات</span><button class="ib" id="avb" onclick="toggleAV()">'+(AUTOV?'🔈 الصوت شغال':'🔇 الصوت مقفول')+'</button></div><div class="box"></div><div id="emo" class="emo">'+EMO.map(e=>'<button type="button" onclick="addEmo(\''+e+'\')">'+e+'</button>').join("")+'</div><div class="row"><button class="ib" onclick="toggleEmo()">😀</button><input id="ci" maxlength="200" placeholder="اكتب رسالة…"><button class="pri" onclick="sendChat()">إرسال</button><button class="ib" id="mic" onpointerdown="micStart()" onpointerup="micStop()" onpointerleave="micStop()" oncontextmenu="return false">🎤</button></div><div class="note">اضغط مطوّلاً على 🎤 وكلّم (لحد 12 ثانية) والكل هيسمعك. الرسايل المكتوبة بتتحفظ على جهازك.</div></div>';document.getElementById("ci").addEventListener("keydown",e=>{if(e.key==="Enter")sendChat()});try{JSON.parse(ls("wa_ch_"+room)||"[]").forEach(o=>addChat(o,1))}catch(e){}}
function go(){const n=document.getElementById("nm").value.trim(),r=document.getElementById("rm").value.trim().replace(/[^A-Za-z0-9\u0600-\u06FF_-]/g,"");if(!n||!r)return;name=n;room=r;PW=(document.getElementById("pw").value||"").normalize("NFKC").trim().toLowerCase();ls("wa_name",n);ls("wa_room",r);ss("wa_auto",JSON.stringify({n:n,r:r,p:PW}));buildChat();join()}
const THEMES=["violet","ocean","forest","sunset","rose"],EMO=["😂","🤣","😍","🥰","😎","🤔","😅","😭","😡","🤯","👍","👎","👏","🙏","🔥","❤️","💔","🎉","🤝","😱","🙈","👀","💀","🤡","😴","🤢","🥳","😜","🤫","🫡","💯","⭐","🕵️","🏆","🎤","😇","🥲","🤪","😏","💪"],PICRE=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]{20,12000}$/;
let PIC=ls("wa_pic")||"",AUTOV=ls("wa_autov")!=="0",rec=null,recChunks=[],recT=0,recStream=null,micTO=0;
function setTheme(t){if(!THEMES.includes(t))t="violet";try{document.documentElement.dataset.theme=t}catch(e){}ls("wa_theme",t)}
function cycleTheme(){const c=ls("wa_theme")||"violet";setTheme(THEMES[(THEMES.indexOf(c)+1)%THEMES.length])}
function AVI(i){const a=(P[i]&&P[i].av)||(i===id&&PIC);return typeof a==="string"&&PICRE.test(a)?'<img class="av" src="'+a+'">':AVT(i)}
function pickPic(){const f=document.getElementById("pf");if(f)f.click()}
function toggleAV(){AUTOV=!AUTOV;ls("wa_autov",AUTOV?"1":"0");const b=document.getElementById("avb");if(b)b.textContent=AUTOV?"🔈 الصوت شغال":"🔇 الصوت مقفول"}
function toggleEmo(){const e=document.getElementById("emo");if(e)e.style.display=e.style.display==="grid"?"none":"grid"}
function addEmo(e){const i=document.getElementById("ci");if(i){i.value+=e;i.focus()}}
function micUI(on){const m=document.getElementById("mic");if(m){m.className="ib"+(on?" rec":"");m.textContent=on?"⏺ بيسجّل…":"🎤"}}
async function micStart(){if(rec)return;try{recStream=await navigator.mediaDevices.getUserMedia({audio:true});const mt=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";rec=new MediaRecorder(recStream,mt?{mimeType:mt,audioBitsPerSecond:16000}:{audioBitsPerSecond:16000});recChunks=[];recT=Date.now();rec.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};rec.onstop=micDone;rec.start();micUI(true);micTO=setTimeout(micStop,12000)}catch(e){rec=null;status="مش قادر أفتح المايك. اسمح بالميكروفون من إعدادات المتصفح (ولازم الموقع يكون HTTPS).";render()}}
function micStop(){clearTimeout(micTO);try{if(rec&&rec.state!=="inactive")rec.stop()}catch(e){}}
function micDone(){const mime=(rec&&rec.mimeType)||"audio/webm",dur=Date.now()-recT;try{recStream.getTracks().forEach(t=>t.stop())}catch(e){}rec=null;micUI(false);if(dur<500||!recChunks.length)return;const blob=new Blob(recChunks,{type:mime});if(blob.size>150000){status="الرسالة الصوتية كبيرة، جرب أقصر";render();return}const fr=new FileReader();fr.onload=()=>{P2("vm",{id:id,name:name,data:String(fr.result),t:Date.now()},0)};fr.readAsDataURL(blob)}
(function(){const f=document.getElementById("pf");if(f)f.addEventListener("change",e=>{const fl=e.target.files&&e.target.files[0];if(!fl)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const S=72,c=document.createElement("canvas");c.width=c.height=S;const x=c.getContext("2d"),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);PIC=c.toDataURL("image/jpeg",.7);ls("wa_pic",PIC);if(cl&&cl.connected)beat();render()};im.src=fr.result};fr.readAsDataURL(fl);e.target.value=""})})();
setTheme(ls("wa_theme")||"violet");
if(ss("wa_auto")){try{const a=JSON.parse(ss("wa_auto"));name=a.n;room=a.r;PW=a.p||"";buildChat();join()}catch(e){render()}}else render();
